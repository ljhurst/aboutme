---
name: Check

# yamllint disable rule:truthy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    uses: ljhurst/stych/.github/workflows/pre-commit.yml@v1
    with:
      terraform-version: "1.17.0"
      node-version-file: .nvmrc
      setup-command: npm ci --prefix aboutme/lambdas && npm ci --prefix aboutme/public

  unit-test:
    uses: ljhurst/stych/.github/workflows/test.yml@feat/test-workflow
    with:
      command: aboutme/scripts/test_lambdas.sh
      node-version-file: .nvmrc
      paths: |
        aboutme/lambdas/**
        aboutme/scripts/test_lambdas.sh
        .github/workflows/check.yml
