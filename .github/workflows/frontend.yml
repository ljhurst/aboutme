name: Frontend

on:
  pull_request:
    paths:
      - 'aboutme/public/**'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - main
    paths:
      - 'aboutme/public/**'
      - '.github/workflows/frontend.yml'

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: aboutme/public/package-lock.json

      - name: Install dependencies
        working-directory: aboutme/public
        run: npm ci

      - name: Run lint
        working-directory: aboutme/public
        run: npm run lint

      - name: Check formatting
        working-directory: aboutme/public
        run: npx prettier --check .

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: aboutme/public/package-lock.json

      - name: Install dependencies
        working-directory: aboutme/public
        run: npm ci

      - name: Build
        working-directory: aboutme/public
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync aboutme/public/dist/ s3://lj-aboutme/ --delete
